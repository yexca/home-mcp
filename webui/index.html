<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Home MCP · Gateway Console</title>
    <link rel="stylesheet" href="/webui/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="ui.skip">跳转到内容</a>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Home MCP">
          <span class="brand-mark" aria-hidden="true">h<span>.</span></span>
          <span><strong>home<span class="brand-light">mcp</span></strong><small>GATEWAY CONSOLE</small></span>
        </a>
        <p class="nav-caption" data-i18n="ui.workspace">工作空间</p>
        <nav id="sidebarNav" class="nav-list" aria-label="Modules"></nav>
        <div class="sidebar-bottom">
          <div class="local-label"><span class="status-dot"></span><span data-i18n="ui.localGateway">本地网关</span></div>
          <p data-i18n="ui.sidebarHint">连接工具，让协作发生。</p>
          <div class="preferences">
            <select id="themeSelect" class="select" aria-label="Theme">
              <option value="system"></option><option value="light"></option><option value="dark"></option>
            </select>
            <select id="languageSelect" class="select" aria-label="Language"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="header">
          <div class="breadcrumb"><span>Workspace</span><span class="slash">/</span><strong id="pageKicker"></strong></div>
          <div class="header-actions">
            <span id="runtimeBadge" class="status-pill muted"></span>
            <span id="restartBadge" class="status-pill warning" hidden></span>
            <button id="refreshStatus" type="button" class="secondary small" hidden></button>
            <button id="disconnect" type="button" class="quiet small" hidden></button>
          </div>
        </header>
        <main id="main" class="main" tabindex="-1">
          <div class="page-heading"><div><p class="eyebrow">HOME MCP / CONSOLE</p><h1 id="pageTitle"></h1><p id="pageDescription" class="page-description"></p></div></div>
          <section id="message" class="message" role="status" aria-live="polite" hidden><span id="messageText"></span><button id="dismissMessage" type="button" class="quiet icon-button" aria-label="关闭">×</button></section>
          <section id="authPanel" class="auth-panel">
            <div class="auth-visual" aria-hidden="true"><div class="gateway-orbit"><span class="orbit-node node-a">↗</span><span class="orbit-node node-b">♫</span><span class="orbit-node node-c">⌘</span><span class="gateway-symbol">h.</span></div><span>ONE GATEWAY. ALL YOUR TOOLS.</span></div>
            <div class="auth-content"><span class="eyebrow">WELCOME HOME</span><h2 data-i18n="ui.welcome"></h2><p data-i18n="empty.body"></p>
              <form id="authForm">
                <label class="field" for="adminToken"><span data-i18n="adminToken"></span></label>
                <div class="secret-control"><input id="adminToken" type="password" autocomplete="current-password" required /><button type="button" class="quiet secret-toggle" data-reveal="adminToken"></button></div>
                <button id="loadStatus" type="submit"></button>
                <small class="auth-hint" data-i18n="ui.tokenHint"></small>
              </form>
            </div>
          </section>
          <form id="configForm" novalidate hidden>
            <fieldset id="configFields"><div id="pageMount"></div></fieldset>
          </form>
        </main>
        <div id="saveBar" class="save-bar" hidden>
          <div class="save-state"><span id="draftDot" class="status-dot"></span><div><strong id="dirtyInfo" aria-live="polite"></strong><small data-i18n="ui.saveHint"></small></div></div>
          <div class="save-actions"><button id="discardDraft" type="button" class="secondary"></button><button id="saveConfig" type="submit" form="configForm"></button></div>
        </div>
        <footer class="footer"><span id="snapshotInfo"></span><span>Home MCP <span id="serverVersion"></span></span></footer>
      </div>
    </div>
    <dialog id="appDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
      <form id="dialogForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button id="dialogClose" type="button" class="quiet icon-button">×</button></div><p id="dialogDescription"></p><label id="dialogInputLabel" class="field" hidden><span data-i18n="ui.agentName"></span><input id="dialogInput" autocomplete="off" maxlength="80" /><small id="dialogError" class="field-error" role="alert"></small></label><div class="dialog-actions"><button id="dialogCancel" type="button" class="secondary"></button><button id="dialogConfirm" type="submit"></button></div></form>
    </dialog>
    <script src="/webui/app.js"></script>
  </body>
</html>
